name: VEXRank test deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vexrank-test-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: website
      - name: Check data regressions
        run: node --test tests/data-regressions.test.mjs tests/team-directory.test.mjs
        working-directory: website
      - name: Verify test API is deployed
        run: curl --fail --retry 2 https://vexrank-api-test.qiansteven54.workers.dev/api/health
      - name: Build test website
        run: pnpm exec vite build --config vite.pages.config.ts
        working-directory: website
        # Optional. When set, the site reads team profiles from events.vex
        # itself; when not, through the Worker.
        env:
          VEX_DIRECT_TOKEN: ${{ secrets.VEX_DIRECT_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy test website
        id: deployment
        uses: actions/deploy-pages@v4
